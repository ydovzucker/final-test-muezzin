version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"  # host can reach Kafka at 9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Fixed: separate ports internally for each listener
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT



  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2 # Use a specific version
    container_name: elasticsearch
    environment:
      - xpack.security.enabled=false # Disable security for simplicity in development
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # Adjust memory as needed
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data # Persist data
    networks:
      - elastic_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2 # Match Elasticsearch version
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200 # Connect to Elasticsearch service
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch # Ensure Elasticsearch starts first
    networks:
      - elastic_network







  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  publisher:
    build: ./publisher
    container_name: publisher
    depends_on:
      - kafka

    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URI=mongodb://mongo:27017/
      - ES_HOST=http://elastic:9200
      - INDEX_ELASTIC=meta_data_audio

      - BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8000:8000"
    command: ["python", "main.py"]

  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      - kafka
      - mongo
      - elastic
    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URI=mongodb://mongo:27017/
      - ES_HOST=http://elastic:9200
      - INDEX_ELASTIC=meta_data_audio

      - BOOTSTRAP_SERVERS=kafka:9092

    ports:
      - "8001:8001"
    command: ["python", "manager.py"]

